<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/SofiFer-App/dist/">
    <title>SofiFer App</title>
    <style>
      body { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        font-family: 'Inter', Arial, sans-serif;
        background: #080808;
        margin: 0;
        color: #E0E0E0;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        border: 3px solid #1a1a1a;
        border-top: 3px solid #C5A059;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .title {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        color: #C5A059;
        margin-bottom: 8px;
      }
      .subtitle {
        font-size: 0.9rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <div class="title">SOFIFER</div>
      <div class="subtitle">🔄 Cargando la app...</div>
    </div>
  </body>
</html>
